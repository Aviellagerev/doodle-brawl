services:
  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: skribbl
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  postgres_data: